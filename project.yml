name: StampQuest
options:
  bundleIdPrefix: app.stampquest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  StampQuest:
    type: application
    platform: iOS
    sources:
      - path: StampQuest
        # FoilSheen.metal needs the Metal Toolchain (xcodebuild -downloadComponent MetalToolchain). Without it the foil sweep
        # uses its gradient fallback; remove this exclude once the toolchain is installed.
        excludes:
          - "**/*.metal"
          # StoreKit test configuration: used by the scheme and StoreKitTest, never shipped in the app.
          - "**/*.storekit"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stampquest.ios
        PRODUCT_NAME: StampQuest
        INFOPLIST_FILE: StampQuest/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ""

  StampQuestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StampQuestTests
      - path: StampQuest/Resources/Plus.storekit
        buildPhase: resources
    dependencies:
      - target: StampQuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stampquest.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StampQuest.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/StampQuest"
        BUNDLE_LOADER: "$(TEST_HOST)"

  StampQuestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StampQuestUITests
    dependencies:
      - target: StampQuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stampquest.ios.uitests
        # XCTestCase initialisers are nonisolated; opt this target out of main-actor-by-default.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StampQuest

schemes:
  StampQuest:
    build:
      targets:
        StampQuest: all
    run:
      config: Debug
      storeKitConfiguration: StampQuest/Resources/Plus.storekit
      # Xcode Run shows the whole onboarding, Plus paywall and exit sheet included. The flags stay off by default and in tests (which
      # pass their own arguments); these launch arguments are read in DEBUG builds only.
      commandLineArguments:
        "-ff-plus": true
        "-ff-coasts": true
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StampQuestTests
        - StampQuestUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
